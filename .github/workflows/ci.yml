name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy Files to EC2 Home Directory
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "mkdir -p ~/website"

          scp -i ~/.ssh/id_rsa -r ./* \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/website/

      - name: Deploy Files to Nginx Directory
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "sudo cp -r ~/website/* /var/www/html/"

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/id_rsa \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "ls -l /var/www/html"

      - name: Print Success
        run: echo "Website deployed successfully!"
